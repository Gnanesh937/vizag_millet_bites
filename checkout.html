<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Millet Bites</title>
  <script async src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="stylesheet" href="checkoutstyle.css">
</head>
<body>
  <div class="checkout-container">
    <h2>Checkout</h2>

    <!-- ✅ Order Summary Section -->
    <div class="order-summary">
      <h3>Your Order</h3>
      <table class="order-table" aria-label="Order summary">
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price (₹)</th>
          </tr>
        </thead>
        <tbody id="order-items"></tbody>
      </table>
      <p id="order-total" style="font-weight: bold; text-align: right; margin-top: 10px;"></p>
    </div>
    <!-- ✅ End Order Summary -->

    <form id="checkout-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" pattern="^[6-9]\d{9}$" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <!-- Address Group -->
      <div class="form-address-group">
        <div class="form-group">
          <label for="door">Door/Flat Number</label>
          <input type="text" id="door" name="door" required>
        </div>
        <div class="form-group">
          <label for="street">Street Name</label>
          <input type="text" id="street" name="street" required>
        </div>
        <div class="form-group">
          <label for="area">Area Name</label>
          <input type="text" id="area" name="area" required>
        </div>
        <div class="form-group">
          <label for="nearby">Nearby Landmark</label>
          <input type="text" id="nearby" name="nearby">
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" required>
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input type="text" id="state" name="state" required>
        </div>
        <div class="form-group">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" name="pincode" placeholder="Pincode" pattern="^[0-9]{6}$" maxlength="6" required>
        </div>
      </div>

      <button type="submit" aria-label="Proceed to Pay">Proceed to Pay</button>
      <button type="button" onclick="goBackToCart()" class="back-button" aria-label="Go back to cart">
        ← Back to Cart
      </button>
    </form>
  </div>

  <script src="checkoutscript.js" defer></script>
</body>
</html>
